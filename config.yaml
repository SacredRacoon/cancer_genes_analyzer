#Параметры генетического алгоритма
ga:
  population_size: 50
  mutation_rate: 0.15
  crossover_rate: 0.8
  generations: 30
  random_state: 228
  elitism_ratio: 0.1      
  min_features: 2
  early_stopping_rounds: 2
  stagnation_threshold: 0.005

#Выбор модели
model:
  type: 'lightgbm'
  random_state: 228
  n_jobs: -1
  
  random_forest:
    n_estimators: 100
    max_depth: 5
    min_samples_split: 2
    min_samples_leaf: 1
    class_weight: 'balanced'
    
  xgboost:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    use_label_encoder: False
    eval_metric: 'mlogloss'
    
  lightgbm:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    num_leaves: 31
    subsample: 0.8
    is_unbalance: true  
    colsample_bytree: 0.8
    
  gradient_boosting:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    subsample: 0.8
    min_samples_split: 2

#Кросс-валидация
cv:
  n_splits: 5
  scoring: 'f1_macro'

#Правила парсинга
data_sources:
  - path: "data/raw/TCGA_GBM_LGG_Mutations_all.csv"
    format: "csv"
    target_column: "Grade"
    target_mapping:
      LGG: 0
      GBM: 1
    mutation_indicator: "MUTATED"
    metadata_columns:
      - "Grade"
      - "Age_at_diagnosis"
      - "Gender"
      - "ID"
      - "Sample_ID"
      - "Patient_ID"
      - "Primary_Diagnosis"
      - "Project"
      - "Case_ID"
      - "Race"
  
  - path: "data/raw/cancer_mutations.txt"
    format: "tsv" 
    target_column: "cancer_type"
    target_mapping: null 
    mutation_indicator: null  
      - "cancer_type"

#Пути
paths:
  raw_data: "data/raw/TCGA_GBM_LGG_Mutations_all.csv"
  output_dir: "output"
  models_dir: "output/models"
  reports_dir: "output/reports"
  plots_dir: "output/plots"
  log_file: "output/logs/app.log"

data_parsing:
  min_tested_threshold: 100  # Ген должен быть проверен минимум у 100 пациентов

# Анализ драйверов и пассажиров
driver_analysis:
  min_mutation_frequency: 0.015  # Минимальная частота мутаций среди проверенных, чтобы считаться драйвером
  min_variance: 0.005            # Минимальная дисперсия (чтобы отсечь гены, которые мутируют одинаково редко везде)

# Кластеризация пациентов
clustering:
  min_clusters: 2
  max_clusters: 5
  random_state: 228
  max_samples_for_base: 5000
  split_large_clusters: true
  max_cluster_size_to_split: 8000
  min_split_clusters: 2
  max_split_clusters: 4

signature_mining:
  min_frequency_difference: 0.05
  min_support_count: 15
  max_combination_size: 3

global_seed: 228

