#Параметры генетического алгоритма
ga:
  population_size: 50
  mutation_rate: 0.15
  crossover_rate: 0.8
  generations: 30
  random_state: 229
  elitism_ratio: 0.1
  min_features: 2

#Выбор модели
model:
  type: 'lightgbm'
  random_state: 229
  n_jobs: -1
  
  random_forest:
    n_estimators: 100
    max_depth: 5
    min_samples_split: 2
    min_samples_leaf: 1
    class_weight: 'balanced'
    
  xgboost:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    use_label_encoder: False
    eval_metric: 'mlogloss'
    
  lightgbm:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    num_leaves: 31
    subsample: 0.8
    is_unbalance: true  
    colsample_bytree: 0.8
    
  gradient_boosting:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    subsample: 0.8
    min_samples_split: 2

#Кросс-валидация
cv:
  n_splits: 5
  scoring: 'f1_macro'

#Правила парсинга
data_sources:
  - path: "data/raw/TCGA_GBM_LGG_Mutations_all.csv"
    format: "csv"
    mutation_indicator: "MUTATED"
    metadata_columns:
      - "Grade"
      - "Age_at_diagnosis"
      - "Gender"
      - "ID"
      - "Sample_ID"
      - "Patient_ID"
      - "Primary_Diagnosis"
      - "Project"
      - "Case_ID"
      - "Race"
  
  - path: "data/raw/cancer_mutations.txt"
    format: "tsv"
    mutation_indicator: null
    metadata_columns:
      - "cancer_type"

#Пути
paths:
  output_dir: "output"
  models_dir: "output/models"
  reports_dir: "output/reports"
  plots_dir: "output/plots"
  log_file: "output/logs/app.log"

data_parsing:
  min_tested_threshold: 100  

# Анализ драйверов и пассажиров
driver_analysis:
  min_mutation_frequency: 0.015
  min_variance: 0.005
  fdr_alpha: 0.05
  use_statistical_test: true       

# Кластеризация пациентов
clustering:
  min_clusters: 3
  max_clusters: 15             
  random_state: 229
  max_samples_for_base: 5000
  split_large_clusters: true
  max_cluster_size_to_split: 2000  
  min_split_clusters: 3            
  max_split_clusters: 5


signature_mining:
  min_frequency_difference: 0.02   
  min_support_count: 4            
  max_combination_size: 4  

global_seed: 229

nmf:
  k_range: [6, 8]
  
  max_iter: 200
  tol: 0.001
  random_state: 229
  
  alpha_l1: 0.1           
  lambda_anchor: 0.5       
  anchor_freq_threshold: 0.10  
  anchor_var_threshold: 0.01   
  
  soft_thresholding:
    mutated: 0.9
    not_mutated: 0.1
    nan: 0.5
  
  stability_n_iterations: 20     
  stability_subsample_ratio: 0.8  
  stability_pi_threshold: 0.7      
  stability_top_n_genes: 10       
  
  huber_delta: 1.0

  